# Checks that a published GGG release is signed with the org release key.
# GGG has no build, so this is the whole gate between a draft and a release
# anyone should pin: a failed check turns the release back into a draft.
name: Verify release signature

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check
        required: true

jobs:
  verify:
    permissions:
      contents: write
    uses: smart-social-contracts/.github/.github/workflows/verify-release.yml@main
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      fingerprint: 6B7B038DEB77849F1F615E67CA38831314D6AA09
      revert_on_failure: ${{ github.event_name == 'release' }}
